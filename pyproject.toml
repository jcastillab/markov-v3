[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-freedom"
version = "10.0.0"
description = "Pronostico de corte comercial de rosas Freedom (M3, RF, GLM, Bayes)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
    "joblib>=1.3",
    "streamlit>=1.40",
    "altair>=5.0",
    "pytest>=8.0",
    "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]